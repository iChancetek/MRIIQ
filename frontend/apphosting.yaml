# Firebase App Hosting configuration for MRIIQ (Backend: mriiq, Region: us-east4)
# Project: quantiq221 (QuantIQ)
# Live Domains: mriiq.fit, mriiq--quantiq221.us-east4.hosted.app

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: quantiq221
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: quantiq221.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: quantiq221.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "956779895214"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:956779895214:web:aa4ce9abe9ad9a8e1e103f"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-259J82Q4SG"
    availability:
      - BUILD
      - RUNTIME
  - variable: OPENAI_MODEL
    value: "gpt-5.6-terra"
    availability:
      - BUILD
      - RUNTIME
